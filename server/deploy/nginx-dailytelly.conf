# Example for host/systemd deployment. Configure valid TLS separately.
server {
    listen 80;
    server_name thedailytelly.com;
    access_log off;
    error_log stderr crit;
    client_max_body_size 16k;
    # Public, versioned introduction assets; no household data lives here.
    location ^~ /media/ {
        alias /opt/dailytelly/current/server/static/media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        proxy_pass http://127.0.0.1:18400;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
